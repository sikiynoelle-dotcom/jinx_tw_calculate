<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jinx 週邊商品預購計算表</title>
    <!-- 引入 Tailwind CSS 與 Google Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 SheetJS (xlsx) 用於前端讀取與生成 Excel 檔 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            position: relative;
            min-height: 100vh;
        }
        /* 固定且淡化的背景圖設定 (透明度 0.4) */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('pic/bg_2.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.4; 
            z-index: -1;
        }
        /* 圖片懸浮放大時的特殊樣式（網頁預覽仍從 pic/ 讀取原圖） */
        .img-container {
            position: relative;
            width: 48px;
            height: 48px;
            margin: 0 auto;
        }
        .img-container img {
            position: absolute;
            top: 0;
            left: 0;
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
            transform-origin: top left;
            z-index: 10;
        }
        .img-container img:hover {
            transform: scale(3.5);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            z-index: 50;
            border-radius: 6px;
        }
    </style>
</head>
<body class="text-slate-800 py-8 px-4 sm:px-6 lg:px-8">
    <div class="max-w-6xl mx-auto">
        <!-- 頁面標題（半透明毛玻璃效果） -->
        <div class="bg-white/70 backdrop-blur-md rounded-2xl shadow-sm border border-white/40 p-6 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">✨ Jinx 週邊商品預購計算表</h1>
                <p class="text-sm text-slate-600 mt-1">請在下方欄位輸入您想要的購買數量，系統將自動幫您即時計算總金額與檢查限購數量。</p>
            </div>
            <!-- 總金額與滿額贈品顯示卡片 -->
            <div class="bg-indigo-50/80 backdrop-blur-sm border border-indigo-100/60 rounded-xl px-6 py-4 flex flex-col gap-3 min-w-[280px]">
                <div class="flex justify-between items-center">
                    <div>
                        <div class="text-xs text-indigo-600 font-medium">總計金額 (TWD)</div>
                        <div id="grandTotal" class="text-2xl font-bold text-indigo-900">NT$ 0</div>
                    </div>
                    <!-- 按鈕群組：清除、匯入、匯出 Excel、匯出含圖 Excel -->
                    <div class="flex flex-col gap-1.5">
                        <button onclick="resetForm()" class="bg-white/80 hover:bg-white text-indigo-600 text-xs px-3 py-1 rounded-lg border border-indigo-200 transition font-medium shadow-sm">
                            清除全部
                        </button>
                        <!-- 隱藏的檔案上傳 input -->
                        <input type="file" id="excelFile" accept=".xlsx, .xls" class="hidden" onchange="importExcel(event)">
                        <button onclick="document.getElementById('excelFile').click()" class="bg-amber-600 hover:bg-amber-700 text-white text-xs px-3 py-1 rounded-lg transition font-medium shadow-sm flex items-center justify-center gap-1">
                            📂 匯入 Excel
                        </button>
                        <button onclick="exportExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-1 rounded-lg transition font-medium shadow-sm flex items-center justify-center gap-1">
                            📊 匯出 Excel
                        </button>
                        <button onclick="exportExcelWithImages()" class="bg-teal-700 hover:bg-teal-800 text-white text-xs px-3 py-1 rounded-lg transition font-medium shadow-sm flex items-center justify-center gap-1">
                            🖼️ 匯出含圖 Excel
                        </button>
                    </div>
                </div>
                <!-- 滿額贈品顯示區塊 -->
                <div class="border-t border-indigo-100/80 pt-2 flex flex-col gap-1.5 text-xs font-medium text-slate-700">
                    <div id="gift1000" class="flex items-center gap-1.5">
                        <span>📷</span> <span>EVENT1 Skinship：0 張</span>
                    </div>
                    <div id="gift2000" class="flex items-center gap-1.5">
                        <span>🃏</span> <span>EVENT2 滿額小卡：0 張</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 商品表格卡片（半透明毛玻璃效果） -->
        <div class="bg-white/70 backdrop-blur-md rounded-2xl shadow-sm border border-white/40 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100/60 text-slate-700 text-xs uppercase tracking-wider border-b border-slate-200/60">
                            <th class="py-3 px-4 font-semibold w-16 text-center">序號</th>
                            <th class="py-3 px-4 font-semibold w-20 text-center">商品圖</th>
                            <th class="py-3 px-4 font-semibold">商品名稱 / 備註</th>
                            <th class="py-3 px-4 font-semibold text-right">單價 (TWD)</th>
                            <th class="py-3 px-4 font-semibold text-center">購買數量</th>
                            <th class="py-3 px-4 font-semibold text-center">限購數量</th>
                            <th class="py-3 px-4 font-semibold text-right">單項總價</th>
                            <th class="py-3 px-4 font-semibold text-center w-24">Sold out</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody" class="divide-y divide-slate-200/40 text-sm">
                        <!-- 動態生成商品列 -->
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="text-center text-xs text-slate-500 mt-6 font-medium drop-shadow-sm">
            本網頁僅供個人試算使用，所有輸入資料皆僅存於您的裝置中，不會發送或回傳至任何伺服器。
        </div>
    </div>

    <script>
        const products = [
            { id: "1", name: "Jinx-Triumph壓克力立牌", price: 850, limit: 1 },
            { id: "2.1", name: "Jinx-Date壓克力立牌 Joo JaeKyung", price: 590, limit: 1, imgId: "002" },

            { id: "5", name: "Jinx-隨機迷你立磚", price: 180, limit: 1, remark: "4款隨機1款" },

            { id: "13", name: "Jinx-Kim Dan成長紀錄組", price: 620, limit: 1 },

            { id: "17", name: "Jinx-抱枕(WOLF JAEKYUNG)", price: 880, limit: 1 },
            { id: "18", name: "Jinx-抱枕(HAMSTER DAN)", price: 880, limit: 1 },
            { id: "19", name: "Jinx-LED場景模型", price: 960, limit: 1 },
            { id: "20", name: "Jinx-Kim Dan證件照組(隨機)", price: 220, limit: 1, remark: "4款隨機1種" },
            { id: "21", name: "Jinx-隨機迷你抱枕鑰匙圈", price: 260, limit: 1, remark: "6款隨機1種" },
            { id: "22", name: "Jinx-JaeKyung滑鼠墊", price: 900, limit: 1 },
            { id: "23", name: "Jinx-海報", price: 320, limit: 1 },
            { id: "24", name: "Jinx-JaeKyung大抱枕", price: 1140, limit: 1 },
            { id: "25", name: "Jinx-毛毯", price: 880, limit: 1 },
            { id: "26.1", name: "DAYBREAK-絨毛娃娃Joo JaeKyung", price: 590, limit: 1, imgId: "026" },
            { id: "26.2", name: "DAYBREAK-絨毛娃娃Kim Dan", price: 590, limit: 1, imgId: "026" },
            { id: "27", name: "Jinx-BBOSIRAEGI MFC選手服", price: 450, limit: 1 },
            { id: "28", name: "Jinx-BBOSIRAEGI 物理治療師制服", price: 660, limit: 1 },
            { id: "29", name: "Jinx-BBOSIRAEGI 動物帽子組", price: 660, limit: 1 },
            { id: "30", name: "Jinx-Team Black圓筒行李袋", price: 2700, limit: 1 },
            { id: "31", name: "Jinx-Team Black POLO衫", price: 1800, limit: 1 },
            { id: "32.1", name: "Jinx-Vol.1(韓版)", price: 500, limit: 1, imgId: "032" },
            { id: "32.2", name: "Jinx-Vol.2(韓版)", price: 500, limit: 1, imgId: "032" },
            { id: "33", name: "JINX一卡通(Joo JaeKyung)", price: 520, limit: 1 },
            { id: "34", name: "JINX 一卡通(Kim Dan)", price: 520, limit: 1 },
            { id: "35", name: "JINX-滑鼠墊", price: 390, limit: 1 },
            { id: "36", name: "JINX-鳳梨牛軋餅乾", price: 170, limit: 1 }
        ];

        let currentGrandTotal = 0;
        let gift1000Count = 0;
        let gift2000Count = 0;

        function renderTable() {
            const tbody = document.getElementById('productTableBody');
            tbody.innerHTML = '';
            
            products.forEach((p, index) => {
                let fileBaseNum = p.imgId ? p.imgId : p.id.split('.')[0].padStart(3, '0');
                // 網頁預覽維持從 pic/ 讀取
                const imgFileName = `pic/${fileBaseNum}.jpg`;

                const tr = document.createElement('tr');
                tr.id = `row_${index}`;
                tr.className = "hover:bg-white/40 transition-colors";
                tr.innerHTML = `
                    <td class="py-3 px-4 text-center font-bold text-indigo-700">${p.id}</td>
                    <td class="py-3 px-4 text-center">
                        <div class="img-container">
                            <img src="${imgFileName}" alt="${p.name}" 
                                class="w-12 h-12 object-cover rounded-lg border border-slate-200/60 shadow-sm cursor-pointer" 
                                onerror="this.src='https://via.placeholder.com/48?text=No+Img'">
                        </div>
                    </td>
                    <td class="py-3 px-4">
                        <div id="name_${index}" class="font-medium text-slate-800">${p.name}</div>
                        ${p.remark ? `<div class="text-xs text-rose-500 font-medium mt-0.5">備註：${p.remark}</div>` : ''}
                    </td>
                    <td id="price_${index}" class="py-3 px-4 text-right text-slate-700">NT$ ${p.price.toLocaleString()}</td>
                    <td class="py-3 px-4 text-center">
                        <input type="number" id="qty_${index}" min="0" max="${p.limit}" value="0" 
                            oninput="calculateTotal()" 
                            class="w-20 text-center border border-slate-300 rounded-lg py-1 px-2 bg-white/90 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 shadow-sm">
                    </td>
                    <td class="py-3 px-4 text-center text-slate-500 text-xs">${p.limit}</td>
                    <td id="subtotal_${index}" class="py-3 px-4 text-right font-semibold text-slate-800">NT$ 0</td>
                    <td class="py-3 px-4 text-center">
                        <input type="checkbox" id="soldout_${index}" onchange="toggleSoldOut(${index})" 
                            class="w-4 h-4 text-rose-600 bg-gray-100 border-gray-300 rounded focus:ring-rose-500 cursor-pointer">
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function toggleSoldOut(index) {
            const isSoldOut = document.getElementById(`soldout_${index}`).checked;
            const qtyInput = document.getElementById(`qty_${index}`);
            const row = document.getElementById(`row_${index}`);
            const nameEl = document.getElementById(`name_${index}`);
            const priceEl = document.getElementById(`price_${index}`);
            const subtotalEl = document.getElementById(`subtotal_${index}`);

            if (isSoldOut) {
                qtyInput.value = 0;
                qtyInput.disabled = true;
                row.classList.add("bg-slate-200/60", "text-slate-400", "opacity-60");
                nameEl.classList.add("line-through");
                priceEl.classList.add("line-through");
                subtotalEl.classList.add("line-through");
            } else {
                qtyInput.disabled = false;
                row.classList.remove("bg-slate-200/60", "text-slate-400", "opacity-60");
                nameEl.classList.remove("line-through");
                priceEl.classList.remove("line-through");
                subtotalEl.classList.remove("line-through");
            }

            calculateTotal();
        }

        function calculateTotal() {
            currentGrandTotal = 0;
            products.forEach((p, index) => {
                const qtyInput = document.getElementById(`qty_${index}`);
                const isSoldOut = document.getElementById(`soldout_${index}`).checked;
                
                let qty = parseInt(qtyInput.value) || 0;
                
                if (isSoldOut) {
                    qty = 0;
                    qtyInput.value = 0;
                }

                if (qty > p.limit) {
                    qty = p.limit;
                    qtyInput.value = qty;
                }
                if (qty < 0) {
                    qty = 0;
                    qtyInput.value = qty;
                }

                const subtotal = qty * p.price;
                currentGrandTotal += subtotal;
                
                document.getElementById(`subtotal_${index}`).innerText = `NT$ ${subtotal.toLocaleString()}`;
            });

            document.getElementById('grandTotal').innerText = `NT$ ${currentGrandTotal.toLocaleString()}`;

            gift1000Count = currentGrandTotal >= 1000 ? 1 : 0;

            if (currentGrandTotal >= 2000) {
                gift2000Count = 2 + Math.floor((currentGrandTotal - 2000) / 1000);
            } else {
                gift2000Count = 0;
            }

            document.getElementById('gift1000').innerHTML = `<span>📷</span> <span>EVENT1 Skinship：${gift1000Count} 張</span>`;
            document.getElementById('gift2000').innerHTML = `<span>🃏</span> <span>EVENT2 滿額小卡：${gift2000Count} 張</span>`;
        }

        function resetForm() {
            products.forEach((p, index) => {
                document.getElementById(`qty_${index}`).value = 0;
                document.getElementById(`soldout_${index}`).checked = false;
                toggleSoldOut(index);
            });
            calculateTotal();
        }

        function exportExcel() {
            let excelData = [];
            let hasItem = false;

            products.forEach((p, index) => {
                const isSoldOut = document.getElementById(`soldout_${index}`).checked;
                const qty = parseInt(document.getElementById(`qty_${index}`).value) || 0;
                
                if (!isSoldOut && qty > 0) {
                    hasItem = true;
                    const subtotal = qty * p.price;
                    excelData.push({
                        "序號": p.id,
                        "商品名稱": p.name,
                        "備註": p.remark || "",
                        "單價 (TWD)": p.price,
                        "購買數量": qty,
                        "單項總價 (TWD)": subtotal
                    });
                }
            });

            if (!hasItem) {
                alert("目前沒有選購任何有效商品喔！");
                return;
            }

            excelData.push({});
            excelData.push({ "序號": "=== 結算資訊 ===" });
            excelData.push({ "序號": "總金額 (TWD)", "商品名稱": currentGrandTotal });
            excelData.push({ "序號": "EVENT1 Skinship", "商品名稱": `${gift1000Count} 張` });
            excelData.push({ "序號": "EVENT2 滿額小卡", "商品名稱": `${gift2000Count} 張` });

            const worksheet = XLSX.utils.json_to_sheet(excelData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "預購清單");

            const colWidths = [
                {wch: 8},
                {wch: 35},
                {wch: 20},
                {wch: 15},
                {wch: 10},
                {wch: 18}
            ];
            worksheet['!cols'] = colWidths;

            XLSX.writeFile(workbook, "jinx_order_summary.xlsx");
        }

        // 修改：匯出含圖 Excel 時，圖片直接抓取已處理好的 img_zoom/ 資料夾圖片
        function exportExcelWithImages() {
            let hasItem = false;
            products.forEach((p, index) => {
                const isSoldOut = document.getElementById(`soldout_${index}`).checked;
                const qty = parseInt(document.getElementById(`qty_${index}`).value) || 0;
                if (!isSoldOut && qty > 0) hasItem = true;
            });

            if (!hasItem) {
                alert("目前沒有選購任何有效商品喔！");
                return;
            }

            let html = `
                <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
                <head>
                    <meta charset="UTF-8">
                    <style>
                        table { border-collapse: collapse; width: 100%; font-family: 'Microsoft JhengHei', sans-serif; }
                        th, td { border: 1px solid #cbd5e1; padding: 6px 10px; text-align: center; vertical-align: middle; }
                        th { background-color: #f1f5f9; font-weight: bold; }
                        .text-left { text-align: left; }
                        .text-right { text-align: right; }
                        /* 直接讀取 img_zoom 內處理好的圖片，維持乾淨整齊的格子大小 */
                        .img-cell { width: 75px; height: 75px; text-align: center; vertical-align: middle; }
                        .product-img { width: 64px; height: 64px; object-fit: contain; display: block; margin: 0 auto; border-radius: 4px; }
                    </style>
                </head>
                <body>
                    <h2>Jinx 週邊商品預購清單</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>序號</th>
                                <th>商品圖</th>
                                <th class="text-left">商品名稱</th>
                                <th class="text-left">備註</th>
                                <th class="text-right">單價 (TWD)</th>
                                <th>購買數量</th>
                                <th class="text-right">單項總價 (TWD)</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            products.forEach((p, index) => {
                const isSoldOut = document.getElementById(`soldout_${index}`).checked;
                const qty = parseInt(document.getElementById(`qty_${index}`).value) || 0;

                if (!isSoldOut && qty > 0) {
                    let fileBaseNum = p.imgId ? p.imgId : p.id.split('.')[0].padStart(3, '0');
                    // 關鍵修改：圖片來源指向 img_zoom 資料夾
                    const imgUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1) + `img_zoom/${fileBaseNum}.jpg`;
                    const subtotal = qty * p.price;

                    html += `
                        <tr>
                            <td><b>${p.id}</b></td>
                            <td class="img-cell"><img src="${imgUrl}" class="product-img" /></td>
                            <td class="text-left">${p.name}</td>
                            <td class="text-left">${p.remark || ""}</td>
                            <td class="text-right">NT$ ${p.price.toLocaleString()}</td>
                            <td><b>${qty}</b></td>
                            <td class="text-right">NT$ ${subtotal.toLocaleString()}</td>
                        </tr>
                    `;
                }
            });

            html += `
                        </tbody>
                    </table>
                    <br>
                    <h3>結算資訊</h3>
                    <table>
                        <tr><td class="text-left"><b>總金額 (TWD)</b></td><td class="text-right"><b>NT$ ${currentGrandTotal.toLocaleString()}</b></td></tr>
                        <tr><td class="text-left"><b>EVENT1 Skinship</b></td><td class="text-right"><b>${gift1000Count} 張</b></td></tr>
                        <tr><td class="text-left"><b>EVENT2 滿額小卡</b></td><td class="text-right"><b>${gift2000Count} 張</b></td></tr>
                    </table>
                </body>
                </html>
            `;

            const blob = new Blob(['\ufeff' + html], { type: 'application/vnd.ms-excel' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `jinx_order_with_images.xls`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importExcel(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet);

                    products.forEach((p, index) => {
                        document.getElementById(`qty_${index}`).value = 0;
                        document.getElementById(`soldout_${index}`).checked = false;
                        toggleSoldOut(index);
                    });

                    let matchCount = 0;
                    json.forEach(row => {
                        const name = row["商品名稱"];
                        const qty = parseInt(row["購買數量"]) || 0;

                        if (name && qty > 0) {
                            const productIndex = products.findIndex(p => p.name === name);
                            if (productIndex !== -1 && !document.getElementById(`soldout_${productIndex}`).checked) {
                                document.getElementById(`qty_${productIndex}`).value = qty;
                                matchCount++;
                            }
                        }
                    });

                    calculateTotal();
                    if (matchCount > 0) {
                        alert(`成功匯入！已自動載入 ${matchCount} 項商品的購買數量。`);
                    } else {
                        alert("未能識別檔案中的商品資料，請確認是否為正確的預購清單 Excel 檔。");
                    }
                } catch (error) {
                    console.error(error);
                    alert("讀取 Excel 檔案時發生錯誤，請確認檔案格式是否正確。");
                }
                
                event.target.value = '';
            };
            reader.readAsArrayBuffer(file);
        }

        renderTable();
    </script>
</body>
</html>
